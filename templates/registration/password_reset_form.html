{% extends "base.html" %}

{% block title %}State Spaces | Reset Password{% endblock %}

{% block content %}
<div class="card auth">
    <h2>Reset Password</h2>
    <p class="muted">Enter the email address on your account and we will send you a link to choose a new password.</p>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
    </form>
    <a class="link-muted" href="{% url 'login' %}">Back to Log In</a>
</div>
{% endblock %}
